<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avto-Kuzatuv Tizimi - Yo'lovchi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; display: block; }
        .navbar { display: flex !important; } /* Yo'lovchi uchun doim ko'rinib turadi */
    </style>
</head>
<body>

    <nav class="navbar" id="main-nav">
        <span id="user-info">Profil: Yo'lovchi (Namangan)</span>
        <button class="logout-btn" onclick="location.reload()">Bosh sahifa</button>
    </nav>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // FIREBASE KONFIGURATSIYASI
        const firebaseConfig = {
            apiKey: "AIzaSyDg2oWFdz3igLICZvXSUHGNUv3NEEdeHZ4",
            authDomain: "bus-tracker-578c8.firebaseapp.com",
            databaseURL: "https://bus-tracker-578c8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bus-tracker-578c8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Xaritani Namangan koordinatalarida ochish
        // Namangan markazi: 40.9983, 71.6726
        const map = L.map('map').setView([40.9983, 71.6726], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};
        let firstUpdate = true; // Birinchi marta lokatsiya olinganda xaritani o'sha yerga qaratish

        // Avtobus uchun maxsus ikonka
        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        // 2. Bazadan barcha avtobuslarni real vaqtda o'qish
        db.ref('avtobuslar').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                console.log("Hozircha faol avtobuslar yo'q.");
                return;
            }

            for (let id in data) {
                const { lat, lng, vaqt } = data[id];

                if (markers[id]) {
                    // Agar avtobus xaritada bo'lsa, o'rnini yangilash
                    markers[id].setLatLng([lat, lng]);
                } else {
                    // Yangi avtobus markerini qo'shish
                    markers[id] = L.marker([lat, lng], {icon: busIcon}).addTo(map)
                                   .bindPopup(`<b>Avtobus: ${id}</b><br>Oxirgi yangilanish: ${vaqt}`);
                }

                // Agar bu birinchi marta ma'lumot kelishi bo'lsa, xaritani o'sha yerga qaratish
                if (firstUpdate) {
                    map.setView([lat, lng], 15);
                    firstUpdate = false;
                }
            }
        });

    </script>
</body>
</html>
