<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus-Tracker | Jonli Xarita</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* Xarita stili */
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Chap tomondagi menyu (Sidebar) */
        .sidebar {
            position: absolute; top: 0; left: -320px; width: 300px; height: 100%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            box-shadow: 2px 0 15px rgba(0,0,0,0.2); z-index: 1000;
            transition: 0.4s all ease; padding: 20px; overflow-y: auto;
        }
        .sidebar.active { left: 0; }

        /* Menyuni ochish tugmasi */
        .menu-toggle {
            position: absolute; top: 20px; left: 20px; width: 45px; height: 45px;
            background: #007bff; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1001; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .menu-toggle:hover { background: #0056b3; transform: scale(1.1); }

        /* Grafik jadvali */
        .schedule-title { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; }
        .bus-route { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #28a745; }
        .route-number { font-weight: bold; color: #333; font-size: 18px; }
        .route-path { font-size: 14px; color: #666; margin: 5px 0; }
        .route-time { font-size: 13px; font-weight: bold; color: #007bff; }

        /* Avtobus ikonkasi stili */
        .bus-marker { filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </div>

    <div id="sidebar" class="sidebar">
        <h2 class="schedule-title"><i class="fas fa-bus"></i> Avtobus Grafigi</h2>
        
        <div class="bus-route">
            <div class="route-number">8-yo'nalish</div>
            <div class="route-path"><i class="fas fa-map-marker-alt"></i> Chorsu - Do'stlik</div>
            <div class="route-time"><i class="fas fa-clock"></i> 07:00 - 19:00 (Har 10 daq)</div>
        </div>

        <div class="bus-route">
            <div class="route-number">12-yo'nalish</div>
            <div class="route-path"><i class="fas fa-map-marker-alt"></i> Aeroport - Temir yo'l bekati</div>
            <div class="route-time"><i class="fas fa-clock"></i> 06:30 - 20:00 (Har 15 daq)</div>
        </div>

        <div class="bus-route">
            <div class="route-number">25-yo'nalish</div>
            <div class="route-path"><i class="fas fa-map-marker-alt"></i> Shodlik - Oromgoh</div>
            <div class="route-time"><i class="fas fa-clock"></i> 07:00 - 18:30 (Har 12 daq)</div>
        </div>

        <p style="font-size: 12px; color: #999; margin-top: 30px;">* Ma'lumotlar real vaqtda yangilanadi.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. Firebase Konfiguratsiyasi
        const firebaseConfig = {
            apiKey: "AIzaSyDg2oWFdz3igLICZvXSUHGNUv3NEEdeHZ4",
            authDomain: "bus-tracker-578c8.firebaseapp.com",
            databaseURL: "https://bus-tracker-578c8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bus-tracker-578c8"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. Xaritani ishga tushirish (Namangan misolida)
        var map = L.map('map', { zoomControl: false }).setView([41.0001, 71.6726], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 3. Sidebar toggle funksiyasi
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // 4. Avtobus ikonkasi sozlamasi
        var busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [40, 40],
            iconAnchor: [20, 20],
            className: 'bus-marker'
        });

        var markers = {};

        // 5. Firebase-dan avtobuslarni real vaqtda o'qish
        // Telegram bot /buses/bus_USERID ko'rinishida saqlaydi
        database.ref('buses').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                for (let id in data) {
                    const bus = data[id];
                    if (markers[id]) {
                        // Marker bor bo'lsa joyini o'zgartirish
                        markers[id].setLatLng([bus.latitude, bus.longitude]);
                    } else {
                        // Yangi marker yaratish
                        markers[id] = L.marker([bus.latitude, bus.longitude], { icon: busIcon })
                            .addTo(map)
                            .bindPopup(`<b>${bus.name}</b><br>Holati: Online`);
                    }
                }
            }
        });
    </script>
</body>
</html>
