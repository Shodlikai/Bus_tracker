<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avtobuslar Harakati - Jonli Xarita</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // SIZNING FIREBASE CONFIGINGIZ
        const firebaseConfig = {
            apiKey: "AIzaSyDg2oWFdz3igLICZvXSUHGNUv3NEEdeHZ4",
            authDomain: "bus-tracker-578c8.firebaseapp.com",
            databaseURL: "https://bus-tracker-578c8-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bus-tracker-578c8",
            storageBucket: "bus-tracker-578c8.firebasestorage.app",
            messagingSenderId: "393621176081",
            appId: "1:393621176081:web:56149080e1b1f2a7b2d6b0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Xaritani Toshkentga qaratib ochish
        const map = L.map('map').setView([41.311081, 69.240562], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markers = {};

        // Avtobus belgisi uchun ikonka (ixtiyoriy)
        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [35, 35]
        });

        // Bazadagi barcha avtobuslarni kuzatish
        db.ref('avtobuslar').on('value', (snapshot) => {
            const data = snapshot.val();
            for (let id in data) {
                const { lat, lng } = data[id];
                if (markers[id]) {
                    markers[id].setLatLng([lat, lng]);
                } else {
                    markers[id] = L.marker([lat, lng], {icon: busIcon}).addTo(map)
                                   .bindPopup("Avtobus ID: " + id);
                }
            }
        });
    </script>
</body>
</html>
